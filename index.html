<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reel Studio · Paste a reel, get a script and a video</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{
  --bg:#07080d; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --ink:#f3f4f8; --mute:#9aa0b4; --dim:#646a80; --a:#7c5cff; --b:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --grad:linear-gradient(135deg,#7c5cff,#22d3ee);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.33;animation:drift 20s ease-in-out infinite alternate}
.orbs i:nth-child(1){width:520px;height:520px;left:-120px;top:-140px;background:var(--a)}
.orbs i:nth-child(2){width:460px;height:460px;right:-120px;bottom:-120px;background:var(--b);animation-duration:26s;opacity:.22}
@keyframes drift{to{transform:translate3d(80px,60px,0) scale(1.15)}}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:rgba(7,8,13,.6);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;letter-spacing:-.02em;padding:0 8px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 26px -6px rgba(124,92,255,.7);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 34px -2px rgba(34,211,238,.75)}}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mute);font-size:15px;text-align:left;position:relative;transition:background .2s,color .2s}
.nav button:hover{background:var(--panel);color:var(--ink)}
.nav button.on{background:var(--panel2);color:var(--ink)}
.nav button.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad)}
.nav svg{flex:none;opacity:.9}
.stat{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.pillrow{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:ping 2s infinite}
.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* main */
main{padding:34px clamp(18px,3.4vw,52px) 70px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px;animation:rise .5s both}
.head h1{font-size:clamp(26px,3vw,38px);letter-spacing:-.035em;font-weight:750;line-height:1.05}
.head h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{color:var(--mute);font-size:15.5px;margin-top:8px;max-width:620px;line-height:1.5}
.banner{border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fde68a;border-radius:14px;padding:14px 16px;margin-bottom:20px;font-size:14.5px;line-height:1.55;animation:rise .5s both}
.banner code,.hint code{font-family:var(--mono);background:rgba(255,255,255,.1);padding:2px 7px;border-radius:6px;font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(14px);animation:rise .55s cubic-bezier(.2,.8,.2,1) both;transition:border-color .25s,box-shadow .25s}
.card:hover{border-color:rgba(124,92,255,.35)}
.col>.card:nth-child(2){animation-delay:.07s}.col>.card:nth-child(3){animation-delay:.14s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.num{width:28px;height:28px;border-radius:9px;background:var(--grad);color:#07080d;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.ch h2{font-size:17px;letter-spacing:-.02em;font-weight:650}
.ch .sp{margin-left:auto;color:var(--mute);font-size:13px}
label.f{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 6px}
label.f:first-of-type{margin-top:0}
input.t,textarea.t,select.t{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:11px 13px;font:inherit;font-size:14.5px;transition:border-color .2s,box-shadow .2s}
input.t:focus,textarea.t:focus,select.t:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
textarea.t{resize:vertical;line-height:1.5;min-height:84px}
input.t::placeholder,textarea.t::placeholder{color:var(--dim)}
select.t option{background:#12131a}
input[type=file]{font-size:13px;color:var(--mute);max-width:100%}
input[type=file]::file-selector-button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:6px 12px;margin-right:10px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14.5px;font-weight:550;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.11);transform:translateY(-1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--grad);border-color:transparent;color:#07080d;font-weight:700;box-shadow:0 10px 30px -10px rgba(124,92,255,.8);position:relative;overflow:hidden}
.btn.pri:hover{box-shadow:0 14px 38px -8px rgba(34,211,238,.6);background:var(--grad)}
.btn.pri::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.pri:hover::after{left:130%}
.btn.big{padding:14px 22px;font-size:16px;border-radius:14px;width:100%}
.btn.busy::before{content:"";width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(7,8,13,.3);border-top-color:#07080d;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.row.end{justify-content:flex-end}
.mut{color:var(--mute)}.small{font-size:12.5px;line-height:1.5}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.moods button,.seg button{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;transition:all .2s}
.moods button:hover,.seg button:hover{border-color:rgba(124,92,255,.6);transform:translateY(-1px)}
.moods button.on,.seg button.on{background:var(--grad);color:#07080d;border-color:transparent;font-weight:650;box-shadow:0 8px 22px -8px rgba(124,92,255,.8)}
.seg{display:flex;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.refs{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.refs li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:12px;padding:10px 12px;font-size:13.5px;animation:pop .35s both}
.refs .k{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;border-radius:5px;padding:2px 7px;background:rgba(124,92,255,.2);color:#c4b5ff;margin-top:2px;flex:none}
.refs .tx{flex:1;min-width:0}
.refs .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.refs .tx span{display:block;color:var(--mute);font-size:12.5px;line-height:1.45;max-height:2.9em;overflow:hidden}
.refs .x{color:var(--mute);font-size:19px;line-height:1;padding:0 4px}.refs .x:hover{color:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.fact{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center}
.fact b{display:block;font-size:18px;letter-spacing:-.02em}.fact span{font-size:10.5px;color:var(--mute);line-height:1.2;display:block}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;color:var(--mute);font-size:13.5px;list-style:none;display:flex;gap:8px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";color:var(--b);font-size:18px;line-height:1;width:14px}
details.more[open] summary::before{content:"–"}
.vir{display:flex;gap:14px;align-items:flex-start;margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.vs{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-content:center;text-align:center;border:5px solid var(--bad)}.vs b{font-size:26px;line-height:1}.vs small{font-size:11px;color:var(--mute)}
.vs.hi{border-color:var(--ok)}.vs.mid{border-color:#fbbf24}
.vfx{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:8px;font-size:13px}.vfx li{display:flex;gap:9px;color:var(--mute)}.vfx code{flex:none;color:var(--ink);background:rgba(255,255,255,.08);padding:0 6px;border-radius:6px;font-size:12px}
.checks{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:12px;font-size:13.5px}
.checks li{display:flex;gap:9px;align-items:center;color:var(--mute)}
.tick{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;background:rgba(52,211,153,.2);color:var(--ok)}
.tick.no{background:rgba(251,191,36,.18);color:var(--warn)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:84px;border-radius:14px;overflow:hidden;border:2px solid transparent;text-align:center;font-size:12px;color:var(--mute);transition:transform .2s,border-color .2s;background:none}
.sw i{display:block;height:46px;border-radius:11px;margin-bottom:6px;border:1px solid rgba(255,255,255,.12)}
.sw:hover{transform:translateY(-3px)}.sw.on{border-color:var(--b);color:var(--ink)}
.stages{display:flex;gap:6px;margin:16px 0 4px}
.stg{flex:1;text-align:center;font-size:11.5px;color:var(--dim)}
.stg i{display:block;height:5px;border-radius:5px;background:rgba(255,255,255,.1);margin-bottom:7px;overflow:hidden;position:relative}
.stg.run{color:var(--ink)}.stg.run i::after{content:"";position:absolute;inset:0;background:var(--grad);animation:slide 1.1s ease-in-out infinite}
.stg.done{color:var(--ok)}.stg.done i{background:var(--ok)}
.stg.fail{color:var(--bad)}.stg.fail i{background:var(--bad)}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
pre.log{margin-top:12px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:12px;padding:12px;font:12px/1.55 var(--mono);color:#aab0c4;max-height:160px;overflow:auto;white-space:pre-wrap}
.result{margin-top:16px;display:grid;grid-template-columns:150px 1fr;gap:16px;animation:pop .5s both}
.result>div{min-width:0}
.two{margin-top:14px}
details.more summary + label.f{margin-top:14px}
.result video{width:150px;border-radius:14px;background:#000;border:1px solid var(--line)}
.slides{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.slides img{height:150px;border-radius:10px;border:1px solid var(--line);flex:none}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.lib .card{padding:14px}
.lib video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:12px;background:#000;display:block;margin-bottom:10px}
.lib .ph{aspect-ratio:9/16;border-radius:12px;background:var(--panel2);display:grid;place-items:center;color:var(--dim);margin-bottom:10px;font-size:13px}
.badge{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--panel2);color:var(--mute)}
.badge.ok{background:rgba(52,211,153,.16);color:var(--ok)}.badge.bad{background:rgba(248,113,113,.16);color:var(--bad)}.badge.run{background:rgba(124,92,255,.2);color:#c4b5ff}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#161824;border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s both;max-width:90vw}
.hint{font-size:13.5px;color:var(--mute);line-height:1.6}
.empty{color:var(--dim);font-size:14px;padding:6px 0}
@media (max-width:1100px){.grid{grid-template-columns:1fr}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}
  .nav{flex-direction:row}.nav button.on::before{display:none}.stat{display:none}.nav button span{display:none}
  .facts{grid-template-columns:repeat(2,1fr)}.result{grid-template-columns:1fr}.two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v4 views */
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;background:rgba(139,92,246,.18);color:#d9ccff;margin-right:4px}
.badge.ok{background:rgba(52,211,153,.16);color:#6ee7b7}.badge.bad{background:rgba(248,113,113,.16);color:#fca5a5}
.ideas,.tl,.pat{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.idea{display:flex;gap:8px;align-items:center;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.idea b{display:block;font-size:14.5px}.idea span{font-size:12.5px;color:var(--mute)}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:14px}
.frames figure{margin:0}.frames img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:9px;display:block;background:#111}
.frames figcaption{font-size:11px;color:var(--mute);margin-top:3px}
.tl li{font-size:13.5px;line-height:1.45;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.tl .k{display:inline-block;min-width:48px;font-weight:700;color:#a5f3fc;font-size:11.5px;text-transform:uppercase;margin-right:6px}
.kwl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.small{font-size:12.5px}.mini{padding:5px 10px!important;font-size:12px!important;min-height:0!important}
select.mini{width:auto}
.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.5;color:#cfcde0;max-height:92px;overflow:hidden;margin:0 0 4px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cal{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.calhead{display:flex;gap:8px;align-items:center;margin-bottom:12px}.calhead b{min-width:150px;text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11.5px;color:var(--mute);text-align:center;padding:4px}
.cc{min-height:84px;text-align:left;padding:6px;border-radius:11px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;font:inherit}
.cc b{font-size:12px}.cc.off{opacity:.38}.cc.today{border-color:#22d3ee}.cc.sel{border-color:#8b5cf6;background:rgba(139,92,246,.14)}
.ev{font-style:normal;font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(139,92,246,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.posted{background:rgba(52,211,153,.28)}.more{font-size:10.5px;color:var(--mute);font-style:normal}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:grid;gap:3px}
.kpi span{font-size:12px;color:var(--mute)}.kpi b{font-size:26px}.kpi small{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px}.bars.small{height:110px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.bar i{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:linear-gradient(#8b5cf6,#5b3fd1);display:block}
.bar i.w{background:linear-gradient(#22d3ee,#8b5cf6)}.bar span{font-size:10.5px;color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.tbl th{text-align:left;font-weight:600;color:var(--mute);padding:10px;font-size:12px}.tbl td{padding:9px 10px;border-top:1px solid rgba(255,255,255,.06)}
.tbl .tt{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tbl .act{white-space:nowrap}.tbl a{color:#a5f3fc}
.pat li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.04);font-size:13.5px}
.pat span{grid-column:1;color:var(--mute);font-size:12.5px}.pat i{grid-row:1/3;grid-column:2;font-style:normal;font-weight:700;align-self:center}
.pat i.up{color:#6ee7b7}.pat i.dn{color:#fca5a5}
.insout{white-space:pre-wrap;line-height:1.6;font-size:14.5px;margin-top:14px}
.rmx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rmx button{text-align:left;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:inherit;cursor:pointer;display:grid;gap:2px;font:inherit}
.rmx button span{font-size:12px;color:var(--mute)}.rmx button.on{border-color:#8b5cf6;background:rgba(139,92,246,.18)}
.hooks li{display:flex;gap:8px;align-items:center}
.story{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.sc9{flex:0 0 74px;aspect-ratio:9/16;border-radius:9px;padding:6px;font-size:8.5px;line-height:1.25;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}
.sc9 small{position:absolute;top:3px;left:5px;font-size:8px;opacity:.6}
.lib .sc{display:block}
@media(max-width:900px){.cal{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr 1fr}}

/* ================= v5: premium design layer ================= */
:root{
  --bg:#05060b; --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.07); --line:rgba(255,255,255,.085);
  --a:#8b6cff; --b:#2de2e6; --c:#ff6ad5;
  --grad:linear-gradient(120deg,#8b6cff 0%,#4cc9f0 55%,#2de2e6 100%);
  --aurora:linear-gradient(100deg,#a78bfa,#60a5fa 35%,#2de2e6 65%,#ff6ad5);
  --sans:"Inter Tight","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}

.orbs i:nth-child(1){background:#7c5cff;opacity:.28}.orbs i:nth-child(2){background:#22d3ee;opacity:.16}

/* sidebar */

  const wps=WPS[LRN.pace]||2.6; let t=0; const starts=L.map(l=>{const a=t;t+=Math.max(1.2,wcnt(l)/wps);return a}), dur=t;
  const at=i=>{const x=Math.round(starts[Math.max(0,Math.min(L.length-1,i))]||0);return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")};
  let score=100; const fixes=[], h=L[0], hs=wcnt(h)/wps;
  if(hs>3.5){score-=15;fixes.push({at:"0:00",t:"Hook takes "+hs.toFixed(1)+" s to say. Get it under 3.5 s."})}
  if(!/\d|\$|₹|%/.test(h)&&!/\byou(r|'re)?\b/i.test(h)&&!/\?\s*$/.test(h)){score-=10;fixes.push({at:"0:00",t:"Hook has no number, question or “you”."})}
  L.forEach((l,i)=>{if(i>0&&wcnt(l)>24){score-=6;fixes.push({at:at(i),t:"This line is "+wcnt(l)+" words. Split it under 24."})}});
  if(!/comment/i.test(L.slice(-2).join(" "))){score-=12;fixes.push({at:at(L.length-1),t:"Ask for a comment (“Comment GUIDE and I'll send it”)."})}
  if(dur<12){score-=12;fixes.push({at:"0:00",t:"Only "+Math.round(dur)+" s at this pace. Aim for 12 s or more."})}
  if(dur>75){score-=10;fixes.push({at:at(L.length-1),t:Math.round(dur)+" s is long. Keep it under 75 s."})}
  if(L.length>=3&&!L.some((l,i)=>i>0&&/\b(but|however|until|except|instead|turns out|here's|the catch|truth|actually|then)\b/i.test(l))){score-=8;fixes.push({at:at(Math.floor(L.length/2)),t:"No turn. Add a “but / the catch / here's the truth” line."})}

/* ---------- text helpers ---------- */
function sceneList(text){
  const parts = String(text||"").split(/\r?\n|\s*\|\s*/).map(l=>l.trim()).filter(Boolean);
  return parts.length>=2 ? parts : (parts[0]||"").split(/(?<=[.!?])\s+(?=\S)|(?<=[a-z][.!?])(?=[A-Z])/).map(l=>l.trim()).filter(Boolean);
}
function cleanMd(t){
  return String(t||"").replace(/^---[\s\S]*?---\s*/,"").replace(/```[\s\S]*?```/g," ").replace(/^\s{0,3}#{1,6}\s+/gm,"")
    .replace(/!?\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/^\s*(?:[-*+]|\d+[.)])\s+/gm,"").replace(/^>\s?/gm,"").replace(/[*_`]{1,3}/g,"").replace(/\n{3,}/g,"\n\n").trim();
}
function checksFor(text){
  const L = sceneList(text), w = t=>t.split(/\s+/).length;
  return [
    [L.length>=3, "At least 3 scenes"],
    [L.length>0 && w(L[0])<=14, "Hook is 14 words or fewer"],
    [L.length>0 && L.every(l=>w(l)<=22), "Each scene is 22 words or fewer"],
    [/comment|follow|link|dm|save|share/i.test(L[L.length-1]||""), "Ends on a call to action"]
  ];
}
const checksHtml = t => checksFor(t).map(([ok,x])=>`<li><span class="tick ${ok?"":"no"}">${ok?"✓":"!"}</span>${esc(x)}</li>`).join("");
const STOP = new Set("this that with have from your you're youre they them their there what when will just like more than into about been were would could should also very much most some only even over such then here make made does done doing being because while where which these those it's its and the for are but not all can out one has had was our get got let".split(" "));
function profileOf(items){
  const scripts = items.map(i=>sceneList(i.text)).filter(l=>l.length); if(!scripts.length) return null;
  const wc = t=>t.split(/\s+/).filter(Boolean).length, avg = a=>a.reduce((x,y)=>x+y,0)/(a.length||1), n = scripts.length, hooks = scripts.map(l=>l[0]), lines = scripts.flat();
  const pct = k => Math.round(100*k/n);
  return { n, scenes:Math.round(avg(scripts.map(l=>l.length))), hook:Math.round(avg(hooks.map(wc))), line:Math.round(avg(lines.map(wc))),
    you:pct(hooks.filter(h=>/\b(you|your|you're)\b/i.test(h)).length), q:pct(hooks.filter(h=>/\?$/.test(h)).length),
    num:pct(hooks.filter(h=>/\d/.test(h)).length), cta:pct(scripts.filter(l=>/comment|follow|link|dm|save|share|subscribe/i.test(l[l.length-1])).length) };
}
function paletteFrom(img){
  const c=document.createElement("canvas"), W=48, H=Math.max(8,Math.round(48*img.naturalHeight/img.naturalWidth)); c.width=W; c.height=H;
  const x=c.getContext("2d",{willReadFrequently:true}); x.drawImage(img,0,0,W,H); const d=x.getImageData(0,0,W,H).data, b={};
  for(let i=0;i<d.length;i+=4){ if(d[i+3]<200) continue; const k=(d[i]>>4)+","+(d[i+1]>>4)+","+(d[i+2]>>4); const o=(b[k]=b[k]||{n:0,r:0,g:0,b:0}); o.n++; o.r+=d[i]; o.g+=d[i+1]; o.b+=d[i+2]; }
  const cols=Object.values(b).sort((a,c)=>c.n-a.n).map(o=>[Math.round(o.r/o.n),Math.round(o.g/o.n),Math.round(o.b/o.n)]);
  const dist=(a,c)=>Math.hypot(a[0]-c[0],a[1]-c[1],a[2]-c[2]), pick=[];
  for(const col of cols){ if(pick.every(p=>dist(p,col)>48)) pick.push(col); if(pick.length>=5) break; }
  while(pick.length<3) pick.push(pick[pick.length-1]||[16,16,32]);
  const hex=a=>a.map(v=>v.toString(16).padStart(2,"0")).join(""), lum=a=>(0.299*a[0]+0.587*a[1]+0.114*a[2])/255, sat=a=>{const m=Math.max(...a),n=Math.min(...a); return m?(m-n)/m:0;};
  const avgL=(lum(pick[0])+lum(pick[1]))/2, fg=avgL>0.55?[23,23,26]:[255,255,255], accent=[...pick].sort((a,c)=>sat(c)-sat(a))[0];
  return { gradients:[[hex(pick[0]),hex(pick[1])],[hex(pick[1]),hex(pick[2])]], text:hex(fg), accent:hex(accent), accentText:lum(accent)>0.6?"17171a":"ffffff", css:`linear-gradient(160deg,#${hex(pick[0])},#${hex(pick[1])})` };
}

async function fetchLinks(){
  const urls=$("#links").value.split(/\s+/).filter(u=>/^https?:\/\//i.test(u)).slice(0,5);
  if(!urls.length){ toast("Paste at least one http(s) link"); return; }
  busy("#fetch",true);
  try{
    const j = await api("/api/fetch",{urls}); let ok=0; const bad=[];
    (j.results||[]).forEach(x=>{ if(x.ok && addRef("link",x.title||x.url,x.text)) ok++; else bad.push((x.url||"").replace(/^https?:\/\/(www\.)?/,"").slice(0,40)+": "+(x.error||"no text found")); });
    paintRefs(); toast(ok?`Fetched ${ok} of ${urls.length}`+(bad.length?`. Could not read: ${bad.join("; ")}`:""):"Could not read the link(s). "+bad.join("; ")+". Paste the caption under More ways to add.");
    if(ok){ S.links=""; const l=$("#links"); if(l) l.value=""; save(); if(!S._one) readRefs(true); }
  }catch(e){ toast("Link reader failed: "+e.message); }
  busy("#fetch",false);
}
function estHtml(){
  const L=sceneList(S.script); if(!L.length) return "";
  const sec=Math.round(L.reduce((t,x)=>t+Math.max(1.8,x.split(/\s+/).length*0.38),0)), mins=Math.max(1,Math.round(sec*1.3/60));
  return `${L.length} scenes · about ${sec}s of video · renders in about ${mins} min.${L.length>14?" <b style=\"color:var(--warn)\">That is a long script. Shorter (6 to 10 scenes) looks better and renders faster.</b>":""}`;
}
function storyHtml(){ const st=allStyles().find(x=>x.id===S.style)||STYLES[0]; return sceneList(S.script).slice(0,14).map((t,i)=>`<div class="sc9" style="background:${st.css};color:${st.fg}"><small>${i+1}</small><span>${esc(t)}</span></div>`).join(""); }
function typeInto(el,text){
  el.value=""; const step=Math.max(1,Math.ceil(text.length/90)); let i=0;
  const t=setInterval(()=>{ i=Math.min(text.length,i+step); el.value=text.slice(0,i); el.scrollTop=el.scrollHeight; if(i>=text.length){ clearInterval(t); S.script=text; save(); $("#checks").innerHTML=checksHtml(text); $("#scnt").textContent=sceneList(text).length+" scenes"; $("#story").innerHTML=storyHtml(); const e2=$("#est"); if(e2) e2.innerHTML=estHtml(); } },16);
}
async function genScript(only){
  if(!S.refs.length && !S.topic.trim()){ toast("Add a reference reel or type a topic first"); return; }
  const refsUsed = (typeof only==="number" && S.refs[only]) ? [S.refs[only].text] : S.refs.map(r=>r.text);
  busy("#gen",true);
  try{
    const j = await ai("script",{refs:refsUsed, mood:S.mood, length:S.length, lang:S.lang, topic:S.topic, character:S.character, avoid:recentTitles()});
    S.script=j.script; save();
    const el=$("#script"); if(!el){ S.view="create"; render(); } else typeInto(el,j.script);
    if(!S.title.trim()){ S.title=(S.topic.trim()||sceneList(j.script)[0]||"").slice(0,120); const t=$("#title"); if(t) t.value=S.title; save(); }
    toast("Script ready. Edit it, or make the video.");
  }catch(e){
    aiFail(e);
  }
  busy("#gen",false);
}
async function makeVideo(){
  if(!sceneList(S.script).length){ toast("Write or generate a script first"); return; }
  if(VO.src!=="none" && !voFresh()){ toast(S.vo.token?"The script changed. Generate the voice-over again, or choose No voice.":"Generate the voice-over first, or choose No voice."); return; }
  busy("#make",true);
  try{
    const c=S.custom; const scenes=undefined;
    const { id } = await api("/api/generate",{title:S.title||"Untitled",script:S.script,scenes,voice:VO.src!=="none"?S.vo.token:undefined,style:S.style,handle:S.handle||undefined,fx:fxPayload(),custom:S.style==="custom"&&c?{gradients:c.gradients,text:c.text,accent:c.accent,accentText:c.accentText}:undefined});
    S.job={id,status:"running",steps:Object.fromEntries(STG.map(k=>[k,"pending"])),log:[],files:{video:null,slides:[]}}; paintJob();
    for(let i=0;i<900;i++){
      await new Promise(r=>setTimeout(r,1100));
      const r=await fetch("/api/jobs/"+id); if(!r.ok) break; S.job=await r.json(); paintJob();
      if(S.job.status!=="running") break;
    }
    if(S.job && S.job.status==="done"){ try{ LRN.runs.unshift({id:id,title:S.title||"Untitled",date:ymd(new Date()),scriptId:S.editingId||"",picks:{theme:S.style,caption:FXS.caption,transition:FXS.transition,pace:LRN.pace}}); LRN.runs=LRN.runs.slice(0,40); lrnSave(); }catch{} }
    if(S.job && S.job.status==="done") toast("Done. Your video and carousel are ready."); else if(S.job && S.job.status==="failed") toast("The render failed. See the log.");
  }catch(e){ toast(e.message); }
  busy("#make",false);
}

function planWeek(){
  const open = S.scripts.filter(s=>s.status!=="posted" && !S.cal.some(c=>c.scriptId===s.id)).slice(0,7);
  if(!open.length){ toast("No unscheduled scripts. Save some from the Studio first."); return; }
  const d = new Date(); let n = 0;
  open.forEach(s=>{ do{ d.setDate(d.getDate()+1); }while(S.cal.some(c=>c.date===ymd(d))); S.cal.push({id:uid(),date:ymd(d),title:s.title,scriptId:s.id,time:"18:00",status:"planned"}); n++; });
  S.month = monthKey(new Date()); save(); render(); toast(`Planned ${n} post${n===1?"":"s"} over the next days`);
}

async function igSync(){
  if(!(S.igUser&&S.igToken)){ S.modal="ig"; paintModal(); return; }
  busy("#igBtn",true);
  try{
    const r = await api("/api/ig/sync",{token:S.igToken,userId:S.igUser}); S.igOk=true; let n=0;
    r.posts.forEach(p=>{ const i=S.posts.findIndex(x=>x.id===p.id); if(i>=0) S.posts[i]=Object.assign({},S.posts[i],p,{title:S.posts[i].title||""}); else { S.posts.push(p); n++; } });
    save(); render(); toast(`Synced ${r.posts.length} posts (${n} new)`);
  }catch(e){ toast("Instagram sync failed: "+e.message); }
  busy("#igBtn",false);
}

/* ---- Insights ---- */
function viewInsights(){
  const P = S.posts;
  if(P.length<3) return `<div class="head"><div><h1>Your <em>insights</em></h1><p>What is working, based on your own posts.</p></div></div><section class="card"><p class="empty">Add at least 3 posts in Analytics to see patterns. The more you add, the better this gets.</p></section>`;
  const bd = bestDay(), sorted = [...P].sort((a,b)=>(a.date||"").localeCompare(b.date||"")), last = sorted.slice(-5), prev = sorted.slice(-10,-5);
  const trend = prev.length ? (avg(last.map(p=>p.views||0))/Math.max(1,avg(prev.map(p=>p.views||0)))-1) : null;
  const test = (name,fn)=>{ const a=P.filter(p=>fn(hookOf(p))), b=P.filter(p=>!fn(hookOf(p))); return a.length&&b.length ? {name,a:avg(a.map(p=>p.views||0)),an:a.length,b:avg(b.map(p=>p.views||0)),bn:b.length} : null; };
  const pat = [test("Hook has a number",h=>/\d/.test(h)),test("Hook is a question",h=>/\?$/.test(h)),test("Hook speaks to “you”",h=>/\b(you|your|you're)\b/i.test(h)),test("Hook is short (8 words or fewer)",h=>h.split(/\s+/).filter(Boolean).length<=8)].filter(Boolean);
  const byMood = {}; P.forEach(p=>{ const sc=p.scriptId&&S.scripts.find(x=>x.id===p.scriptId); if(sc&&sc.mood) (byMood[sc.mood]=byMood[sc.mood]||[]).push(p.views||0); });
  const moods = Object.entries(byMood).map(([m,a])=>[m,avg(a),a.length]).sort((a,b)=>b[1]-a[1]);
  const wd = bd ? bd.all.map(([d,a,n])=>`<div class="bar"><i style="height:${Math.max(4,a/bd.avg*100)}%" class="${d===WD.indexOf(bd.day)?"w":""}"></i><span>${WD[d].slice(0,3)}</span></div>`).join("") : "";
  const card = (t,b)=>`<section class="card"><div class="ch"><h2>${t}</h2></div>${b}</section>`;
  const stats = JSON.stringify(P.slice(0,40).map(p=>({date:p.date,type:p.type,hook:hookOf(p).slice(0,90),views:p.views||0,likes:p.likes||0,comments:p.comments||0,saves:p.saves||0,shares:p.shares||0,mood:(S.scripts.find(x=>x.id===p.scriptId)||{}).mood||""})));
  S._stats = stats;
  return `${needServer()}<div class="head"><div><h1>Your <em>insights</em></h1><p>Patterns found in your own posts. Small samples are noisy, so treat these as hints.</p></div></div>
  <div class="grid"><div class="col">
    ${learnCard()}${liftCard()}
    ${card("Momentum",`<p style="font-size:15.5px;line-height:1.6">Your last 5 posts average <b>${fmtN(avg(last.map(p=>p.views||0)))}</b> views${trend===null?".":`, <b style="color:${trend>=0?"var(--ok)":"var(--bad)"}">${trend>=0?"up":"down"} ${Math.abs(Math.round(trend*100))}%</b> from the 5 before.`}</p>`)}
    ${bd?card("Best day to post",`<p style="font-size:15.5px;margin-bottom:14px"><b>${bd.day}</b> averages ${fmtN(bd.avg)} views.</p><div class="bars small">${wd}</div>`):""}
    ${pat.length?card("What your hooks show",`<ul class="pat">${pat.map(p=>`<li><b>${esc(p.name)}</b><span>${fmtN(p.a)} views (${p.an} posts) vs ${fmtN(p.b)} without (${p.bn})</span><i class="${p.a>=p.b?"up":"dn"}">${p.a>=p.b?"▲":"▼"} ${Math.abs(Math.round((p.a/Math.max(1,p.b)-1)*100))}%</i></li>`).join("")}</ul>`):""}
    ${moods.length?card("Mood",`<ul class="pat">${moods.map(([m,a,n])=>`<li><b>${esc(m)}</b><span>${n} post${n===1?"":"s"}</span><i class="up">${fmtN(a)} avg</i></li>`).join("")}</ul>`):""}
  </div><div class="col">
    <section class="card"><div class="ch"><h2>Ask Claude what to make next</h2></div><p class="hint">Sends only your post numbers and hooks (no account access).</p>
      <div class="row"><button class="btn pri" data-act="aiInsights" id="aiInsBtn" ${S.local?"":"disabled"}>✨ Get recommendations</button></div>
      <div id="insOut" class="insout">${esc(S.insightText||"")}</div></section>
  </div></div>`;
}

    busy("#dailyBtn",true);
    try{
      const r=await ai("script",{refs:S.refs.map(x=>x.text),mood:S.mood,length:S.length,lang:S.lang,topic,character:S.character,avoid:recentTitles(),daily:true});
      if(!typed&&q.length){ S.queue=q.slice(1).join("\n"); }
      const hook=firstLine(r.script);
      const rec=putScript({title:(topic||hook).slice(0,80),text:r.script,mood:S.mood,length:S.length,lang:S.lang,status:"draft"});
      S.daily={date:ymd(new Date()),topic:topic||hook,text:r.script,id:rec.id}; S.dtopic="";
      S.editingId=rec.id; S.title=rec.title; S.script=r.script; S.topic=topic; save(); render(); toast("Today's script is ready and saved to Scripts");
    }catch(e){ aiFail(e); }
    busy("#dailyBtn",false);
  },
  dailyOpen: () => { S.view="create"; render(); window.scrollTo(0,0); },
  dailyMake: async () => { S.view="create"; render(); window.scrollTo(0,0); await makeVideo(); },
  dailyPlan: () => { const d=S.daily; if(!d) return; const dt=new Date(); do{ dt.setDate(dt.getDate()+1); }while(S.cal.some(c=>c.date===ymd(dt))); addCal(ymd(dt),d.topic,d.id); toast("Scheduled for "+dt.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"short"})); render(); },
  queueIdeas: async () => {
    busy("#qiBtn",true);
    try{ const r=await ai("ideas",{refs:S.refs.map(x=>x.text)}); S.queue=[S.queue||"",...r.ideas.map(x=>x.hook)].map(x=>x.trim()).filter(Boolean).join("\n"); save(); render(); }
    catch(e){ aiFail(e); }
    busy("#qiBtn",false);
  },
  vidLook: () => { const a=S.vid&&S.vid.analysis; if(a&&validTheme(a.theme)){ S.style=a.theme; } if(a&&a.character) S.character=a.character; save(); toast("Look and character copied to the Studio"); }
});
IN.dtopic = el => { S.dtopic=el.value; save(); };
IN.queue = el => { S.queue=el.value; save(); };

/* ---------- boot ---------- */
(async()=>{
  try{ if(location.protocol!=="file:"){ const r=await fetch("/api/ping",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j.local){ S.local=true; S.hasKey=!!j.hasKey; S.cli=!!j.cli; } } } }catch{}
  S.checked=true; render(); if(S.view==="home") loadJobs();
  $("#main").addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(b&&ACT[b.dataset.act]){ e.preventDefault(); ACT[b.dataset.act](b,e); } });
  $("#main").addEventListener("input",e=>{ const k=e.target.dataset&&e.target.dataset.in; if(k&&IN[k]) IN[k](e.target); });
  $("#main").addEventListener("change",e=>{ const k=e.target.dataset&&e.target.dataset.ch; if(k&&CH[k]) CH[k](e.target); });
  document.addEventListener("click",e=>{ if(e.target.id==="refLib") loadJobs(); });
})();
})();
</script>
</body>
</html>
